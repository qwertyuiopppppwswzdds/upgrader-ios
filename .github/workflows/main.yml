name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main 
jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Проверить Xcode
        run: xcodebuild -version

      - name: Собрать приложение
        run: |
          xcodebuild \
            -project UpgraderIOS.xcodeproj \
            -scheme UpgraderIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Создать IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/UpgraderIOS.app Payload/
          zip -r UpgraderIOS.ipa Payload
          rm -rf Payload

      - name: Загрузить IPA
        uses: actions/upload-artifact@v4
        with:
          name: UpgraderIOS-IPA
          path: UpgraderIOS.ipa
